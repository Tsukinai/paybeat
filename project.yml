# Xcode project spec; generate PayBeat.xcodeproj with `xcodegen`.
name: PayBeat
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
targets:
  PayBeat:
    type: application
    platform: macOS
    sources:
      - path: Sources/PayBeat
      - path: Localization
        buildPhase: resources
      - path: Icon/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.workticker
        PRODUCT_NAME: PayBeat
    dependencies:
      - target: PayBeatWidget
        embed: true
  PayBeatWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget/PayBeatWidget.swift
      - path: Sources/PayBeat/Config.swift
      - path: Sources/PayBeat/Format.swift
      - path: Sources/PayBeat/Salary.swift
      - path: Sources/PayBeat/Holidays.swift
      - path: Sources/PayBeat/Model.swift
      - path: Localization
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.workticker.widget
        PRODUCT_NAME: PayBeatWidget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
